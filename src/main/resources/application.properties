# ==============================================================================
# Student Task Management Application - Configuration
# ==============================================================================

# Application Name
spring.application.name=student-task-manager

# Server Port (Default is 8080)
server.port=8080

# ==============================================================================
# MySQL Database Configuration
# ==============================================================================
# URL format: jdbc:mysql://[host]:[port]/[database_name]
# - createDatabaseIfNotExist=true: Automatically creates the database if it does not exist yet
# - useSSL=false: Disables SSL for simple local development
# - serverTimezone=UTC: Avoids timezone mismatches between Java and MySQL
# - allowPublicKeyRetrieval=true: Required for MySQL 8 authentication
spring.datasource.url=jdbc:mysql://localhost:3306/student_task_manager?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# Database credentials
# NOTE: Update 'spring.datasource.password' with your local MySQL root password
spring.datasource.username=root
spring.datasource.password=root

# JDBC Driver for MySQL 8+
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================================================
# Spring Data JPA & Hibernate Configuration
# ==============================================================================
# ddl-auto options:
# - update: Hibernate updates the database schema automatically when entity changes
# - validate: Validates tables without modifying schema
# - create-drop: Drops and recreates tables each time the app restarts
spring.jpa.hibernate.ddl-auto=update

# Show generated SQL queries in the console (great for learning!)
spring.jpa.show-sql=true

# Format SQL queries neatly across multiple lines for better readability
spring.jpa.properties.hibernate.format_sql=true

# Hibernate dialect optimized for MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Disable automatic execution of schema.sql / data.sql on startup
# (Hibernate ddl-auto=update handles table creation, while schema.sql is for MySQL Workbench)
spring.sql.init.mode=never

# ==============================================================================
# Logging Configuration
# ==============================================================================
logging.level.org.springframework.web=INFO
logging.level.com.student.taskmanager=DEBUG
logging.level.org.hibernate.SQL=DEBUG
