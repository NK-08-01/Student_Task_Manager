# ==============================================================================
# Student Task Management Application - Configuration
# ==============================================================================

# Application Name
spring.application.name=student-task-manager

# Server Port (Default is 8080)
server.port=8080

# ==============================================================================
# Database Configuration
# ==============================================================================
# H2 File Database (ACTIVE)
# Saves data to local folder ./data/student_task_manager so tasks persist between restarts!
# No MySQL password required to run.
spring.datasource.url=jdbc:h2:file:./data/student_task_manager;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enable H2 Web Console to inspect database tables in your browser at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ------------------------------------------------------------------------------
# MySQL Configuration (Uncomment when you have your MySQL password ready)
# ------------------------------------------------------------------------------
# spring.datasource.url=jdbc:mysql://localhost:3306/student_task_manager?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=YOUR_MYSQL_PASSWORD
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================================================
# Spring Data JPA & Hibernate Configuration
# ==============================================================================
# 'update' automatically generates and updates the table schema based on Task.java
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in the console (great for learning!)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Keep schema.sql for manual inspection
spring.sql.init.mode=never

# ==============================================================================
# Logging Configuration
# ==============================================================================
logging.level.org.springframework.web=INFO
logging.level.com.student.taskmanager=DEBUG
logging.level.org.hibernate.SQL=DEBUG
